name: Process 2pc Video

on:
  repository_dispatch:
    types: [process_new_song]
  workflow_dispatch:
    inputs:
      song_id:
        description: 'Song EXT / ID'
        required: true
      artist:
        description: 'Artist Name'
        required: true
      title:
        description: 'Song Title'
        required: true

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl wireguard-tools

      - name: Install Python packages
        run: |
          pip install --upgrade "yt-dlp[default]" supabase requests bgutil-ytdlp-pot-provider
          yt-dlp --update-to nightly || true

      - name: Setup Cloudflare WARP Proxy
        run: |
          # Install wgcf (Cloudflare WARP config generator)
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64
          chmod +x wgcf
          ./wgcf register --accept-tos
          ./wgcf generate

          # Install wireproxy
          curl -fsSL -o wireproxy.tar.gz https://github.com/pufferffish/wireproxy/releases/download/v1.0.9/wireproxy_linux_amd64.tar.gz
          tar -xzf wireproxy.tar.gz
          chmod +x wireproxy

          # Add SOCKS5 section to the config
          echo -e "\n[Socks5]\nBindAddress = 127.0.0.1:1080" >> wgcf-profile.conf

          # Start the proxy in background
          ./wireproxy -c wgcf-profile.conf &
          sleep 5
          echo "Cloudflare WARP proxy started on socks5://127.0.0.1:1080"

      - name: Start bgutil POT Provider
        run: |
          docker pull brainicism/bgutil-ytdlp-pot-provider
          docker rm -f bgutil-provider || true
          docker run -d --name bgutil-provider -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:4416/ping; then
              echo "✅ POT server ready"
              break
            fi
            sleep 2
          done

      - name: Run Video Processor
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          PYTHON_SONG_ID="${{ github.event.client_payload.song_id || github.event.inputs.song_id }}"
          PYTHON_ARTIST="${{ github.event.client_payload.artist || github.event.inputs.artist }}"
          PYTHON_TITLE="${{ github.event.client_payload.title || github.event.inputs.title }}"
          python process_video.py "$PYTHON_SONG_ID" "$PYTHON_ARTIST" "$PYTHON_TITLE"
